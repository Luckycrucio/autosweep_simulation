- ros_topic_name: "/lidar_rear/points"
  gz_topic_name: "/lidar_rear/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
  frame_id: "lidar_rear_link"
