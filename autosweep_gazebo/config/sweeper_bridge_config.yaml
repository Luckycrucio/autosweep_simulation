# Bridge Gazebo -> ROS dei sensori presenti nel modello (sweeper_complete.urdf.xacro).
# I frame_id ROS dei LiDAR e delle IMU sono assegnati qui: i sensori Gazebo non
# usano gz_frame_id, che non fa parte dello standard SDF e genera warning.
# I sensori usano la QoS predefinita (reliable): e' compatibile sia con i
# subscriber reliable sia con quelli best effort come RViz.
# I LiDAR anteriori disattivati nel modello (lidar_front_low, _high, _fwd, _bwd)
# non hanno bridge: per riattivarne uno copiare le voci di lidar_front
# cambiando nome dei topic e frame_id.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
  qos_profile: CLOCK

# LiDAR anteriore
- ros_topic_name: "/lidar_front/scan"
  gz_topic_name: "/lidar_front"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
  frame_id: "lidar_front_link"
  lazy: true

- ros_topic_name: "/lidar_front/points"
  gz_topic_name: "/lidar_front/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
  frame_id: "lidar_front_link"
  lazy: true

- ros_topic_name: "/lidar_front/imu"
  gz_topic_name: "/lidar_front/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
  frame_id: "lidar_front_link"
  lazy: true

# LiDAR posteriore
- ros_topic_name: "/lidar_rear/scan"
  gz_topic_name: "/lidar_rear"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
  frame_id: "lidar_rear_link"
